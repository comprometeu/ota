<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talkie invite</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="invite-page">
  <main class="invite-card">
    <div class="avatar invite-avatar" id="invite-avatar">?</div>
    <p class="invite-kicker">Public group invite</p>
    <h1 id="invite-name">Loading invite...</h1>
    <p class="invite-description" id="invite-description"></p>
    <p class="muted invite-meta" id="invite-meta"></p>
    <p class="form-error" id="invite-error" role="alert"></p>
    <button class="primary-btn invite-join" id="invite-join" type="button" disabled>Join group</button>
    <a class="ghost-btn invite-home" id="invite-home" href="/">Back to Talkie</a>
  </main>
  <script src="/invite.js"></script>
</body>
</html>
